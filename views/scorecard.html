<!DOCTYPE html>
<html lang="en" data-default-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Tickets Scorecard</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme-d.css"/>
<style>
.intro{font-size:13px;color:var(--dim);font-weight:600;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border-radius:22px;padding:18px 20px;cursor:pointer;box-shadow:var(--shadow);border:1px solid transparent;transition:transform .1s,border-color .15s;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{transform:translateY(-2px);border-color:var(--border)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.week{font-size:16px;font-weight:800}
.badge-new{background:var(--brand);color:#0f172a;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.sub{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 12px;margin-top:6px;background:var(--row);border-radius:12px;font-size:13px;font-weight:600}
.row .v{font-weight:800;font-size:15px}
.delta{font-size:11px;font-weight:700;color:var(--dim);margin-left:6px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:1000px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 20px}
.modal-head h3{font-size:18px;font-weight:800}
.sec{font-size:14px;font-weight:800;padding:14px 20px 4px}
.page > .groups{margin-top:2px}
.overlay.hidden{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar select{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 14px;color:var(--text);font-family:var(--sans);font-size:13px;font-weight:700;outline:none}
.bar select:focus-visible{border-color:var(--ink)}
.group{display:flex;flex-direction:column;gap:12px}
.group-head{display:flex;align-items:baseline;gap:10px}
.group-head h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.group-head span{font-size:13px;color:var(--dim);font-weight:600}
.groups{display:flex;flex-direction:column;gap:26px}
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <div class="brand"><div class="logo" aria-hidden="true">AM</div><div><div class="page-date">Weekly · Mon–Sun</div><h1 class="page-title">Tickets Seat Scorecard</h1></div></div>
    <button class="theme-btn" onclick="toggleTheme()">Theme</button>
  </div>
  <div class="intro">Weekly measurables for the Tickets team (Mon–Sun). A new card is added automatically after each week ends. Each week sits in the month that holds most of its days. Click a card for the full week.</div>
  <div class="bar">
    <div class="toggle-row" role="group" aria-label="View">
      <button class="pill-tab active" id="vMonth" onclick="setView('month')">Monthly</button>
      <button class="pill-tab" id="vYear" onclick="setView('year')">Yearly</button>
    </div>
    <label><span class="sr" style="position:absolute;left:-9999px">Period</span><select id="period" onchange="render()"></select></label>
  </div>
  <div id="grid" class="groups"><div class="empty">Loading…</div></div>
</div>
<div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeCard()"><div class="modal" id="modal"></div></div>

<script>
// Public, read-only: the data comes from /api/public/scorecards (no agent emails).
let cards=[], tz='America/Los_Angeles';
const FLAG={green:'var(--accent)',yellow:'var(--warn)',red:'var(--danger)'};
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtHM(m){m=Math.round(+m||0);if(m<=0)return '0m';const h=Math.floor(m/60),r=m%60;return h?(r?`${h}h ${r}m`:`${h}h`):`${r}m`;}
const day=d=>new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const weekLabel=c=>`${day(c.weekStart)} – ${day(c.weekEnd)}, ${c.weekEnd.slice(0,4)}`;
const val=m=>m.value==null?'–':m.unit==='%'?`${m.value}%`:fmtHM(m.value);
const color=m=>FLAG[m.flag]||'var(--text)';
const pct=v=>v==null?'–':`${v}%`;
// change vs the previous week (lower is better except SLA met and CSAT)
function delta(m,prev){
  const p=prev?.measurables?.find(x=>x.key===m.key);
  if(m.value==null||p?.value==null) return '';
  const d=+(m.value-p.value).toFixed(1); if(!d) return '<span class="delta">= last week</span>';
  const better=['sla','csat'].includes(m.key)?d>0:d<0;
  const txt=m.unit==='%'?`${d>0?'+':''}${d} pts`:`${d>0?'+':'−'}${fmtHM(Math.abs(d))}`;
  return `<span class="delta" style="color:${better?'var(--accent)':'var(--danger)'}">${d>0?'▲':'▼'} ${txt}</span>`;
}
// A Mon–Sun week belongs to the month holding at least 4 of its 7 days,
// which is the month (and year) its Thursday falls in.
const monthKey=c=>new Date(Date.parse(c.weekStart+'T00:00:00Z')+3*86400000).toISOString().slice(0,7);
const monthName=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
let view='month';
function cardHtml(i){
  const c=cards[i];
  return `<button class="card" onclick="openCard(${i})">
      <div class="card-top"><div class="week">${weekLabel(c)}</div>${i===0?'<span class="badge-new">Latest</span>':''}</div>
      <div class="sub">${c.totals.resolved+c.totals.closed} resolved/closed · ${c.agents.length} agents</div>
      ${c.measurables.map(m=>`<div class="row"><span>${esc(m.label)}</span><span><span class="v" style="color:${color(m)}">${val(m)}</span>${delta(m,cards[i+1])}</span></div>`).join('')}
    </button>`;
}
function setView(v){
  view=v;
  document.getElementById('vMonth').classList.toggle('active',v==='month');
  document.getElementById('vYear').classList.toggle('active',v==='year');
  const keys=[...new Set(cards.map(c=>v==='month'?monthKey(c):monthKey(c).slice(0,4)))];   // newest first
  document.getElementById('period').innerHTML=keys.map(k=>`<option value="${k}">${v==='month'?monthName(k):k}</option>`).join('');
  render();
}
function render(){
  const grid=document.getElementById('grid'), sel=document.getElementById('period').value;
  const idx=cards.map((c,i)=>i).filter(i=>view==='month'?monthKey(cards[i])===sel:monthKey(cards[i]).startsWith(sel));
  const months=[...new Set(idx.map(i=>monthKey(cards[i])))];
  grid.innerHTML=months.map(k=>{
    const ws=idx.filter(i=>monthKey(cards[i])===k);
    return `<section class="group"><div class="group-head"><h2>${monthName(k)}</h2><span>${ws.length} week${ws.length===1?'':'s'}</span></div>
      <div class="grid">${ws.map(cardHtml).join('')}</div></section>`;
  }).join('')||'<div class="empty">No weeks in this period</div>';
}
async function load(){
  const grid=document.getElementById('grid');
  try{
    const r=await fetch('/api/public/scorecards'); const d=await r.json(); if(!d.ok) throw new Error(d.error);
    cards=d.scorecards; tz=d.tz||tz;
    if(!cards.length){ grid.innerHTML='<div class="empty">No weekly scorecards yet — the first one appears after the week ends.</div>'; return; }
    setView('month');
  }catch(e){ grid.innerHTML=`<div class="empty">Could not load the scorecard: ${esc(e.message)}</div>`; }
}
function openCard(i){
  const c=cards[i], prev=cards[i+1];
  const meas=c.measurables.map(m=>{
    const p=prev?.measurables?.find(x=>x.key===m.key);
    return `<tr><td class="an">${esc(m.label)}</td>
      <td><span class="num" style="color:${color(m)}">${val(m)}</span></td>
      <td><span class="num" style="color:var(--dim)">${p?val(p):'–'}</span>${delta(m,prev)}</td>
      <td class="mono" style="color:var(--dim)">${esc(m.detail)}</td></tr>`;
  }).join('');
  const agents=c.agents.map(a=>`<tr><td class="an">${esc(a.name)}</td>
    <td><span class="num">${a.resolved}</span></td><td><span class="num">${a.closed}</span></td>
    <td><span class="num">${pct(a.slaMetPct)}</span><div class="ae">${a.slaDue?`${a.slaDue-a.slaBreached} of ${a.slaDue}`:''}</div></td>
    <td><span class="num">${a.firstReplyMin?fmtHM(a.firstReplyMin):'–'}</span></td>
    <td><span class="num">${pct(a.csat?.csatPct)}</span><div class="ae">${a.csat?.total?`${a.csat.negative} neg of ${a.csat.total}`:''}</div></td>
    <td><span class="num" style="color:${a.empathy?.missed?'var(--danger)':'inherit'}">${a.empathy?.upset?`${a.empathy.missed} of ${a.empathy.upset}`:'–'}</span><div class="ae">${a.empathy?.reviewed?`${a.empathy.reviewed} reviewed`:''}</div></td>
    <td><span class="num" style="color:${a.sop?.incorrect?'var(--danger)':'inherit'}">${a.sop?.covered?`${a.sop.incorrect} of ${a.sop.covered}`:'–'}</span><div class="ae">${a.sop?.reviewed?`${a.sop.reviewed} reviewed`:''}</div></td></tr>`).join('');
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><div><h3>Tickets Seat Scorecard · ${weekLabel(c)}</h3>
      <div class="ae" style="margin-top:4px">Saved ${new Date(c.generatedAt).toLocaleString('en-US',{timeZone:tz,month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})} · ${c.totals.resolved} resolved · ${c.totals.closed} closed</div></div>
      <button class="btn" onclick="closeCard()">✕ Close</button></div>
    <div class="sec">Measurables</div>
    <div class="tbl-scroll"><table><thead><tr><th>Measurable</th><th>This week</th><th>Previous week</th><th>Detail</th></tr></thead><tbody>${meas}</tbody></table></div>
    <div class="sec">By agent</div>
    <div class="tbl-scroll"><table><thead><tr><th>Agent</th><th>Resolved</th><th>Closed</th><th>SLA met</th><th>First reply</th><th>CSAT</th><th>Empathy missed</th><th>Against SOP</th></tr></thead>
      <tbody>${agents||'<tr><td colspan="8" class="empty">No activity this week</td></tr>'}</tbody></table></div>
    <div style="height:14px"></div>`;
  document.getElementById('overlay').classList.remove('hidden');
}
function closeCard(){ document.getElementById('overlay').classList.add('hidden'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });
load();
</script>
</body>
</html>
