<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Tickets Scorecard</title>
<script src="/theme.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root{
  --bg:#0d0f14;--surface:#13161e;--card:#181c26;--border:#1f2436;
  --accent:#00e5a0;--warn:#ffb800;--danger:#ff4d6a;--info:#4d9fff;--purple:#a064ff;
  --muted:#2e3347;--text:#dde2f0;--dim:#636b8a;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:22px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:20px;font-weight:600}
.intro{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:18px}
.btn{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:6px 13px;font-size:12px;font-family:var(--mono);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .1s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.week{font-family:var(--mono);font-size:13px;font-weight:600;margin-bottom:2px}
.sub{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid var(--border);font-size:12px}
.row .v{font-family:var(--mono);font-weight:600}
.delta{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px}
.sec{font-size:11px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:16px 18px 8px}
.item{border-left:3px solid var(--danger);padding:6px 12px;margin:0 18px 8px;font-size:12px;line-height:1.5}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{text-align:left;padding:9px 14px;font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);background:rgba(255,255,255,.015);white-space:nowrap}
td{padding:11px 14px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.an{font-weight:500;font-size:12px}.ae{font-size:10px;color:var(--dim);font-family:var(--mono)}
.mono{font-family:var(--mono);font-size:11px}
.num{font-family:var(--mono);font-size:13px;font-weight:600}
.tkt{color:var(--info);text-decoration:none;font-family:var(--mono);font-weight:600}
.tkt:hover{text-decoration:underline}
.empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📊 Tickets Seat Scorecard</h1>
    <button class="theme-btn" onclick="toggleTheme()">☀ Light</button>
  </div>
  <div class="intro">Weekly measurables for the Tickets team (Mon–Sun). A new card is added automatically after each week ends. Click a card for the full report.</div>
  <div id="grid" class="grid"><div class="empty">Loading…</div></div>
</div>
<div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeCard()"><div class="modal" id="modal"></div></div>

<script>
// Public, read-only: the data comes from /api/public/scorecards (no agent emails).
let cards=[], tz='America/Los_Angeles';
const FLAG={green:'var(--accent)',yellow:'var(--warn)',red:'var(--danger)'};
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtHM(m){m=Math.round(+m||0);if(m<=0)return '0m';const h=Math.floor(m/60),r=m%60;return h?(r?`${h}h ${r}m`:`${h}h`):`${r}m`;}
const day=d=>new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const weekLabel=c=>`${day(c.weekStart)} – ${day(c.weekEnd)}, ${c.weekEnd.slice(0,4)}`;
const val=m=>m.value==null?'–':m.unit==='%'?`${m.value}%`:fmtHM(m.value);
const color=m=>FLAG[m.flag]||'var(--text)';
const pct=v=>v==null?'–':`${v}%`;
// change vs the previous week (lower is better except SLA met and CSAT)
function delta(m,prev){
  const p=prev?.measurables?.find(x=>x.key===m.key);
  if(m.value==null||p?.value==null) return '';
  const d=+(m.value-p.value).toFixed(1); if(!d) return '<span class="delta">= last week</span>';
  const better=['sla','csat'].includes(m.key)?d>0:d<0;
  const txt=m.unit==='%'?`${d>0?'+':''}${d} pts`:`${d>0?'+':'−'}${fmtHM(Math.abs(d))}`;
  return `<span class="delta" style="color:${better?'var(--accent)':'var(--danger)'}">${d>0?'▲':'▼'} ${txt}</span>`;
}
async function load(){
  const grid=document.getElementById('grid');
  try{
    const r=await fetch('/api/public/scorecards'); const d=await r.json(); if(!d.ok) throw new Error(d.error);
    cards=d.scorecards; tz=d.tz||tz;
    if(!cards.length){ grid.innerHTML='<div class="empty">No weekly scorecards yet — the first one appears after the week ends.</div>'; return; }
    grid.innerHTML=cards.map((c,i)=>`<div class="card" onclick="openCard(${i})">
      <div class="week">${weekLabel(c)}</div>
      <div class="sub">${c.totals.resolved+c.totals.closed} resolved/closed · ${c.agents.length} agents</div>
      ${c.measurables.map(m=>`<div class="row"><span>${esc(m.label)}</span><span><span class="v" style="color:${color(m)}">${val(m)}</span>${delta(m,cards[i+1])}</span></div>`).join('')}
    </div>`).join('');
  }catch(e){ grid.innerHTML=`<div class="empty">Could not load the scorecard: ${esc(e.message)}</div>`; }
}
function openCard(i){
  const c=cards[i], prev=cards[i+1];
  const meas=c.measurables.map(m=>{
    const p=prev?.measurables?.find(x=>x.key===m.key);
    return `<tr><td class="an">${esc(m.label)}</td>
      <td><span class="num" style="color:${color(m)}">${val(m)}</span></td>
      <td><span class="num" style="color:var(--dim)">${p?val(p):'–'}</span>${delta(m,prev)}</td>
      <td class="mono" style="color:var(--dim)">${esc(m.detail)}</td></tr>`;
  }).join('');
  const agents=c.agents.map(a=>`<tr><td class="an">${esc(a.name)}</td>
    <td><span class="num">${a.resolved}</span></td><td><span class="num">${a.closed}</span></td>
    <td><span class="num">${pct(a.slaMetPct)}</span><div class="ae">${a.slaDue?`${a.slaDue-a.slaBreached} of ${a.slaDue}`:''}</div></td>
    <td><span class="num">${a.firstReplyMin?fmtHM(a.firstReplyMin):'–'}</span></td>
    <td><span class="num">${pct(a.csat?.csatPct)}</span><div class="ae">${a.csat?.total?`${a.csat.negative} neg of ${a.csat.total}`:''}</div></td>
    <td><span class="num" style="color:${a.empathy?.missed?'var(--danger)':'inherit'}">${a.empathy?.upset?`${a.empathy.missed} of ${a.empathy.upset}`:'–'}</span><div class="ae">${a.empathy?.reviewed?`${a.empathy.reviewed} reviewed`:''}</div></td>
    <td><span class="num" style="color:${a.sop?.incorrect?'var(--danger)':'inherit'}">${a.sop?.covered?`${a.sop.incorrect} of ${a.sop.covered}`:'–'}</span><div class="ae">${a.sop?.reviewed?`${a.sop.reviewed} reviewed`:''}</div></td></tr>`).join('');
  const tkt=it=>`<a class="tkt" href="${esc(it.url)}" target="_blank" rel="noopener">#${it.ticketId}</a> · ${esc(it.agent)} · ${esc(it.date?day(it.date):'')}`;
  const emp=c.flagged.empathy.map(it=>`<div class="item">${tkt(it)}${it.handling?` · ${esc(it.handling)}`:''}<div style="color:var(--dim)">${esc(it.reason)}</div></div>`).join('');
  const sop=c.flagged.sop.map(it=>`<div class="item">${tkt(it)}${it.topic?` · ${esc(it.topic)}`:''}<div>SOP: ${esc(it.sopRule)}</div><div style="color:var(--dim)">Agent: ${esc(it.agentAction)}</div></div>`).join('');
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><div><h3>Tickets Seat Scorecard · ${weekLabel(c)}</h3>
      <div class="ae" style="margin-top:4px">Saved ${new Date(c.generatedAt).toLocaleString('en-US',{timeZone:tz,month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})} · ${c.totals.resolved} resolved · ${c.totals.closed} closed</div></div>
      <button class="btn" onclick="closeCard()">✕ Close</button></div>
    <div class="sec">Measurables</div>
    <div class="tbl-scroll"><table><thead><tr><th>Measurable</th><th>This week</th><th>Previous week</th><th>Detail</th></tr></thead><tbody>${meas}</tbody></table></div>
    <div class="sec">By agent</div>
    <div class="tbl-scroll"><table><thead><tr><th>Agent</th><th>Resolved</th><th>Closed</th><th>SLA met</th><th>First reply</th><th>CSAT</th><th>Empathy missed</th><th>Against SOP</th></tr></thead>
      <tbody>${agents||'<tr><td colspan="8" class="empty">No activity this week</td></tr>'}</tbody></table></div>
    <div class="sec">Empathy missed (${c.flagged.empathy.length})</div>${emp||'<div class="empty" style="padding:8px 18px">None</div>'}
    <div class="sec">Resolved against the SOP (${c.flagged.sop.length})</div>${sop||'<div class="empty" style="padding:8px 18px">None</div>'}
    <div style="height:14px"></div>`;
  document.getElementById('overlay').classList.remove('hidden');
}
function closeCard(){ document.getElementById('overlay').classList.add('hidden'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });
load();
</script>
</body>
</html>
